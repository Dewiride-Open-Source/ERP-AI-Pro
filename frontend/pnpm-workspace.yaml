packages:
  - apps/*
  - packages/*
  - e2e

catalogMode: strict
minimumReleaseAge: 1440
blockExoticSubdeps: true

allowBuilds:
  sharp: true
  unrs-resolver: true

peerDependencyRules:
  allowedVersions:
    eslint-plugin-import>eslint: "10"
    eslint-plugin-jsx-a11y>eslint: "10"
    eslint-plugin-react>eslint: "10"

overrides:
  "minimatch@>=7 <11.0.1": 11.0.4

catalog:
  next: 16.4.3
  react: 19.3.1
  react-dom: 19.3.1
  typescript: 6.0.3
  "@types/node": 24.19.2
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  eslint: 10.13.0
  "@eslint/compat": 2.1.1
  eslint-config-next: 16.4.3
  eslint-config-prettier: 10.1.8
  prettier: 3.9.10
  prettier-plugin-tailwindcss: 0.8.1
  tailwindcss: 4.3.3
  "@tailwindcss/postcss": 4.3.3
  postcss: 8.5.32
  shadcn: 4.23.0
  radix-ui: 1.8.1
  class-variance-authority: 0.7.1
  cn: 0.5.1
  lucide-react: 1.65.0
  tw-animate-css: 1.4.0
  next-themes: 0.4.6
  sonner: 2.0.8
  server-only: 0.0.1
  geist: 1.8.2
  "@vercel/otel": 2.2.0
  "@opentelemetry/api": 1.9.1
  "@opentelemetry/api-logs": 0.223.0
  "@opentelemetry/sdk-logs": 0.223.0
  "@opentelemetry/instrumentation": 0.223.0
  "@playwright/test": 1.65.0
  zod: 4.6.7
  react-hook-form: 7.91.0
  react-day-picker: 10.0.2
  "@tanstack/react-table": 9.3.1
  motion: 14.8.0
  "@axe-core/playwright": 4.14.0
  "@microsoft/kiota-abstractions": 1.0.0-preview.111
  "@microsoft/kiota-http-fetchlibrary": 1.0.0-preview.111
  "@microsoft/kiota-serialization-json": 1.0.0-preview.111
