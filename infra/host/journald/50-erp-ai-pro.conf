# The server's records are kept a year inside India: DPDP Rules 2025, rules 6(1)(e) and 8(3); CERT-In Directions of
# 28.04.2022, direction (iv). journald deletes whole journal files, each holding up to a month of entries (MaxFileSec=), so
# 400 days keep every entry more than a year. From Ubuntu 24.04 on a file grows to 128 MB at most and journald keeps 100
# files by default, so SystemMaxFiles= lets SystemMaxUse= be the limit.
[Journal]
Storage=persistent
SystemMaxUse=24G
SystemKeepFree=20G
SystemMaxFiles=400
MaxRetentionSec=400d
Compress=yes
