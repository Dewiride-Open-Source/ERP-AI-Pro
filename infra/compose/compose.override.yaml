services:
  migrator:
    environment:
      DOTNET_ENVIRONMENT: Development
    extra_hosts:
      - host.docker.internal:host-gateway
    secrets:
      - Erp__Platform__Database__MigratorConnectionString

  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      Erp__Platform__Attachments__EmulatorHost: azurite
      Erp__Platform__Identity__TenantId: 11111111-1111-1111-1111-111111111111
      Erp__Platform__Identity__ClientId: 22222222-2222-2222-2222-222222222222
      Erp__Platform__Identity__WebOrigin: http://localhost:3000
    extra_hosts:
      - host.docker.internal:host-gateway
    secrets:
      - Erp__Platform__Database__ConnectionString
      - Erp__Platform__Attachments__EncryptionKey
      - Erp__Platform__Identity__ClientCertificate
    depends_on:
      azurite:
        condition: service_healthy
    ports:
      - "127.0.0.1:5080:8080"

  web:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${WEB_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    ports:
      - "127.0.0.1:3000:3000"

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--blobPort", "10000", "--location", "/data", "--disableTelemetry"]
    volumes:
      - azurite-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(10000, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      start_interval: 1s
      retries: 3
    networks:
      - erp
    restart: unless-stopped

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13@sha256:064b50d557fcaffd10f06bf79ba4069bd50994a84034f1a0fc35c165500482d7
    profiles: [observability]
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    networks:
      - erp
    ports:
      - "127.0.0.1:18888:18888"
    restart: unless-stopped

volumes:
  azurite-data:

secrets:
  Erp__Platform__Database__ConnectionString:
    file: ./secrets/Erp__Platform__Database__ConnectionString
  Erp__Platform__Database__MigratorConnectionString:
    file: ./secrets/Erp__Platform__Database__MigratorConnectionString
  Erp__Platform__Attachments__EncryptionKey:
    file: ./secrets/Erp__Platform__Attachments__EncryptionKey
  Erp__Platform__Identity__ClientCertificate:
    file: ./secrets/Erp__Platform__Identity__ClientCertificate
