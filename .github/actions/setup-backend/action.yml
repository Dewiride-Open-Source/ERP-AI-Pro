name: Set up backend
description: Installs the .NET SDK from global.json, restores the local tools from dotnet-tools.json and restores NuGet packages in locked mode.
runs:
  using: composite
  steps:
    - name: Set up .NET SDK
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: backend/global.json
        cache: true
        cache-dependency-path: |
          backend/Hosts/**/packages.lock.json
          backend/.config/dotnet-tools.json
    - name: Restore tools
      shell: bash
      working-directory: backend
      run: dotnet tool restore
    - name: Restore packages
      shell: bash
      working-directory: backend
      run: dotnet restore --locked-mode
