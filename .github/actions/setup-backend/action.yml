name: Set up backend
description: Installs the .NET SDK from global.json and restores NuGet packages in locked mode.
runs:
  using: composite
  steps:
    - name: Set up .NET SDK
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: backend/global.json
        cache: true
        cache-dependency-path: backend/Hosts/**/packages.lock.json
    - name: Restore packages
      shell: bash
      working-directory: backend
      run: dotnet restore --locked-mode
