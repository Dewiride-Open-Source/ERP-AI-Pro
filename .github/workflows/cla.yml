name: cla

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Contributor licence agreement
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      # The range starts at the base branch as it is now, not at the event's base commit, so commits a contributor
      # brings in by merging a newer base branch are never taken for their own.
      - name: Fetch the pull request head and the current base branch
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/head" "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Check contributor licence agreements
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: node scripts/checks/cla.ts --base "refs/remotes/origin/${BASE_REF}" --head "$HEAD_SHA" --pull-request-author "$PR_AUTHOR"
