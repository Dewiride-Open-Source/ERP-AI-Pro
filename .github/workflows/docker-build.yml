name: docker-build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_TAG: ci

jobs:
  build-and-smoke:
    name: Build images and smoke test the compose stack
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up backend
        uses: ./.github/actions/setup-backend
      - name: Start SQL Server
        id: sql
        uses: ./.github/actions/start-sql-server
      - name: Build API
        working-directory: backend
        run: dotnet build Hosts/Api/Dewiride.Erp.Host.Api --no-restore
      - name: Apply migrations
        working-directory: backend
        env:
          Erp__Platform__Database__ConnectionString: ${{ steps.sql.outputs.database-connection-string }}
        run: |
          dotnet ef database update --no-build --context IdempotencyDbContext --project BuildingBlocks/Idempotency/Dewiride.Erp.BuildingBlocks.Idempotency --startup-project Hosts/Api/Dewiride.Erp.Host.Api
          dotnet ef database update --no-build --context SystemInfoDbContext --project Modules/Platform/SystemInfo/Module/Dewiride.Erp.Modules.Platform.SystemInfo --startup-project Hosts/Api/Dewiride.Erp.Host.Api
      - name: Write the compose database secret
        env:
          CONNECTION_STRING: ${{ steps.sql.outputs.container-connection-string }}
        run: mkdir -p infra/compose/secrets && printf '%s' "$CONNECTION_STRING" > infra/compose/secrets/Erp__Platform__Database__ConnectionString
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: false
          load: true
          tags: ghcr.io/dewiride-open-source/erp-ai-pro/api:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: false
          load: true
          tags: ghcr.io/dewiride-open-source/erp-ai-pro/web:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Validate compose files
        working-directory: infra/compose
        run: |
          docker compose -f compose.yaml -f compose.override.yaml config --quiet
          docker compose -f compose.yaml -f compose.production.yaml config --quiet
      - name: Set up Node.js for the smoke script
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Smoke test the running stack
        run: node scripts/checks/compose-smoke.ts
