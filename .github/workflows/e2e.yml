name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  playwright:
    name: Playwright (${{ matrix.project }}, shard ${{ matrix.shard }} of 2)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(github.event_name == 'pull_request' && '["chromium","mobile-android"]' || '["chromium","firefox","webkit","mobile-android","mobile-ios","tablet-ios"]') }}
        shard: [1, 2]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up backend
        uses: ./.github/actions/setup-backend
      - name: Set up frontend
        uses: ./.github/actions/setup-frontend
      - name: Start SQL Server
        id: sql
        uses: ./.github/actions/start-sql-server
      - name: Start Azurite
        id: azurite
        uses: ./.github/actions/start-azurite
      - name: Generate the attachments encryption key
        id: attachments-key
        run: |
          material="$(openssl rand -base64 32)"
          echo "::add-mask::$material"
          echo "encryption-key=ci:$material" >> "$GITHUB_OUTPUT"
      - name: Generate a throwaway sign-in certificate
        id: signin-certificate
        run: |
          signin="$(mktemp -d "$RUNNER_TEMP/signin.XXXXXX")"
          openssl req -x509 -newkey rsa:2048 -noenc -days 2 -subj "/CN=erp-e2e" -keyout "$signin/key.pem" -out "$signin/certificate.pem"
          openssl pkcs12 -export -inkey "$signin/key.pem" -in "$signin/certificate.pem" -passout pass: -out "$signin/certificate.pfx"
          certificate="$(base64 -w 0 "$signin/certificate.pfx")"
          rm -rf -- "$signin"
          echo "::add-mask::$certificate"
          echo "client-certificate=$certificate" >> "$GITHUB_OUTPUT"
      - name: Build API and migrator
        working-directory: backend
        run: |
          dotnet build Hosts/Api/Dewiride.Erp.Host.Api --no-restore -c Release
          dotnet build Hosts/Migrator/Dewiride.Erp.Host.Migrator --no-restore -c Release
      - name: Migrate the database
        working-directory: backend
        env:
          DOTNET_ENVIRONMENT: Development
          Erp__Platform__Database__ConnectionString: ${{ steps.sql.outputs.database-connection-string }}
        run: dotnet run --project Hosts/Migrator/Dewiride.Erp.Host.Migrator --no-build -c Release --no-launch-profile -- migrate
      - name: Build web app
        working-directory: frontend
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Install Playwright browsers
        working-directory: frontend/e2e
        run: pnpm exec playwright install --with-deps
      - name: Start API
        working-directory: backend
        env:
          Erp__Platform__Database__ConnectionString: ${{ steps.sql.outputs.database-connection-string }}
          Erp__Platform__Attachments__EmulatorHost: ${{ steps.azurite.outputs.emulator-host }}
          Erp__Platform__Attachments__EncryptionKey: ${{ steps.attachments-key.outputs.encryption-key }}
          Erp__Platform__Identity__TenantId: 11111111-1111-1111-1111-111111111111
          Erp__Platform__Identity__ClientId: 22222222-2222-2222-2222-222222222222
          Erp__Platform__Identity__ClientCertificate: ${{ steps.signin-certificate.outputs.client-certificate }}
          Erp__Platform__Identity__WebOrigin: http://localhost:3000
        run: |
          nohup dotnet run --project Hosts/Api/Dewiride.Erp.Host.Api --no-build -c Release > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5080/healthz/live && break; sleep 1; done
          curl -sf http://localhost:5080/healthz/live
      - name: Start web app
        working-directory: frontend/apps/web
        env:
          API_INTERNAL_URL: http://localhost:5080
        run: |
          nohup pnpm exec next start -p 3000 > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/healthz && break; sleep 1; done
          curl -sf http://localhost:3000/healthz
      - name: Start web app without an API
        working-directory: frontend/apps/web
        env:
          API_INTERNAL_URL: http://127.0.0.1:1
        run: |
          nohup pnpm exec next start -p 3001 > "$RUNNER_TEMP/web-offline.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3001/healthz && break; sleep 1; done
          curl -sf http://localhost:3001/healthz
      - name: Start API with the system-info and attachments modules disabled
        working-directory: backend
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5081
          APPCONFIG_ENDPOINT: ""
          Erp__Platform__Database__ConnectionString: ${{ steps.sql.outputs.database-connection-string }}
          Erp__Platform__Attachments__EmulatorHost: ${{ steps.azurite.outputs.emulator-host }}
          Erp__Platform__Attachments__EncryptionKey: ${{ steps.attachments-key.outputs.encryption-key }}
          Erp__Platform__Identity__TenantId: 11111111-1111-1111-1111-111111111111
          Erp__Platform__Identity__ClientId: 22222222-2222-2222-2222-222222222222
          Erp__Platform__Identity__ClientCertificate: ${{ steps.signin-certificate.outputs.client-certificate }}
          Erp__Platform__Identity__WebOrigin: http://localhost:3002
          feature_management__feature_flags__0__id: Erp.Modules.Platform.SystemInfo
          feature_management__feature_flags__0__enabled: "false"
          feature_management__feature_flags__1__id: Erp.Modules.Platform.Attachments
          feature_management__feature_flags__1__enabled: "false"
        run: |
          nohup dotnet run --project Hosts/Api/Dewiride.Erp.Host.Api --no-build --no-launch-profile -c Release > "$RUNNER_TEMP/api-gated.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5081/healthz/live && break; sleep 1; done
          curl -sf http://localhost:5081/healthz/live
      - name: Start web app against the gated API
        working-directory: frontend/apps/web
        env:
          API_INTERNAL_URL: http://localhost:5081
        run: |
          nohup pnpm exec next start -p 3002 > "$RUNNER_TEMP/web-gated.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3002/healthz && break; sleep 1; done
          curl -sf http://localhost:3002/healthz
      - name: Run Playwright
        working-directory: frontend/e2e
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_API_BASE_URL: http://localhost:5080
          E2E_OFFLINE_BASE_URL: http://localhost:3001
          E2E_GATED_BASE_URL: http://localhost:3002
          E2E_GATED_API_BASE_URL: http://localhost:5081
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.project }}-${{ matrix.shard }}.zip
        run: pnpm exec playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blob-report-${{ matrix.project }}-${{ matrix.shard }}
          path: frontend/e2e/blob-report
          retention-days: 7
          if-no-files-found: error
      - name: Upload screenshots and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            frontend/e2e/screenshots
            frontend/e2e/test-results
          retention-days: 14
          if-no-files-found: warn
      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-logs-${{ matrix.project }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/*.log
          retention-days: 7

  report:
    name: Playwright
    needs: playwright
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up frontend
        uses: ./.github/actions/setup-frontend
      - name: Download blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: blob-report-*
          merge-multiple: true
          path: frontend/e2e/all-blob-reports
      - name: Merge into one HTML report
        working-directory: frontend/e2e
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports
      - name: Upload HTML report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/e2e/playwright-report
          retention-days: 14
          if-no-files-found: error
      # The one job the ruleset requires, so it fails whenever a shard did not pass, whatever the number of projects and shards.
      - name: Fail when a shard did not pass
        if: ${{ needs.playwright.result != 'success' }}
        env:
          SHARDS_RESULT: ${{ needs.playwright.result }}
        run: |
          echo "::error::The Playwright shards ended as $SHARDS_RESULT."
          exit 1
