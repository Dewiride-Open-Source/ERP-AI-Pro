name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  playwright:
    name: Playwright (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(github.event_name == 'pull_request' && '["chromium","mobile-android"]' || '["chromium","firefox","webkit","mobile-android","mobile-ios"]') }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up backend
        uses: ./.github/actions/setup-backend
      - name: Set up frontend
        uses: ./.github/actions/setup-frontend
      - name: Build API
        working-directory: backend
        run: dotnet build Hosts/Api/Dewiride.Erp.Host.Api --no-restore -c Release
      - name: Build web app
        working-directory: frontend
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Install Playwright browsers
        working-directory: frontend/e2e
        run: pnpm exec playwright install --with-deps
      - name: Start API
        working-directory: backend
        run: |
          nohup dotnet run --project Hosts/Api/Dewiride.Erp.Host.Api --no-build -c Release > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5080/healthz/live && break; sleep 1; done
          curl -sf http://localhost:5080/healthz/live
      - name: Start web app
        working-directory: frontend/apps/web
        env:
          API_INTERNAL_URL: http://localhost:5080
        run: |
          nohup pnpm exec next start -p 3000 > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/healthz && break; sleep 1; done
          curl -sf http://localhost:3000/healthz
      - name: Start web app without an API
        working-directory: frontend/apps/web
        env:
          API_INTERNAL_URL: http://127.0.0.1:1
        run: |
          nohup pnpm exec next start -p 3001 > "$RUNNER_TEMP/web-offline.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3001/healthz && break; sleep 1; done
          curl -sf http://localhost:3001/healthz
      - name: Run Playwright
        working-directory: frontend/e2e
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_API_BASE_URL: http://localhost:5080
          E2E_OFFLINE_BASE_URL: http://localhost:3001
        run: pnpm exec playwright test --project=${{ matrix.project }}
      - name: Upload report and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-${{ matrix.project }}
          path: |
            frontend/e2e/playwright-report
            frontend/e2e/screenshots
            frontend/e2e/test-results
          retention-days: 14
          if-no-files-found: warn
      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-logs-${{ matrix.project }}
          path: ${{ runner.temp }}/*.log
          retention-days: 7
