name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  playwright:
    name: Playwright (${{ matrix.project }}, shard ${{ matrix.shard }} of 2)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(github.event_name == 'pull_request' && '["chromium","mobile-android"]' || '["chromium","firefox","webkit","mobile-android","mobile-ios","tablet-ios"]') }}
        shard: [1, 2]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up backend
        uses: ./.github/actions/setup-backend
      - name: Set up frontend
        uses: ./.github/actions/setup-frontend
      - name: Start SQL Server
        id: sql
        uses: ./.github/actions/start-sql-server
      - name: Start Azurite
        id: azurite
        uses: ./.github/actions/start-azurite
      - name: Build the end-to-end API host
        working-directory: backend
        run: dotnet build Tests/EndToEnd/Dewiride.Erp.Testing.EndToEndHost --no-restore -c Release
      - name: Build web app
        working-directory: frontend
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Install Playwright browsers
        working-directory: frontend/e2e
        run: pnpm exec playwright install --with-deps
      - name: Start API
        working-directory: backend
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          ERP_TEST_SQL_CONNECTION: ${{ steps.sql.outputs.server-connection-string }}
          ERP_TEST_BLOB_EMULATOR_HOST: ${{ steps.azurite.outputs.emulator-host }}
        run: |
          nohup dotnet run --project Tests/EndToEnd/Dewiride.Erp.Testing.EndToEndHost --no-build -c Release -- --port 5180 --web-origin https://localhost:3200 > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:5180/healthz/live && break; sleep 1; done
          curl -sf http://127.0.0.1:5180/healthz/live
      - name: Start web app
        working-directory: frontend/apps/web
        env:
          API_INTERNAL_URL: http://127.0.0.1:5180
        run: |
          nohup pnpm exec next start -H 127.0.0.1 -p 3100 > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3100/healthz && break; sleep 1; done
          curl -sf http://127.0.0.1:3100/healthz
      - name: Start web app without an API
        working-directory: frontend/apps/web
        env:
          API_INTERNAL_URL: http://127.0.0.1:1
        run: |
          nohup pnpm exec next start -H 127.0.0.1 -p 3101 > "$RUNNER_TEMP/web-offline.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3101/healthz && break; sleep 1; done
          curl -sf http://127.0.0.1:3101/healthz
      - name: Start API with the system-info and attachments modules disabled
        working-directory: backend
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          ERP_TEST_SQL_CONNECTION: ${{ steps.sql.outputs.server-connection-string }}
          ERP_TEST_BLOB_EMULATOR_HOST: ${{ steps.azurite.outputs.emulator-host }}
          feature_management__feature_flags__0__id: Erp.Modules.Platform.SystemInfo
          feature_management__feature_flags__0__enabled: "false"
          feature_management__feature_flags__1__id: Erp.Modules.Platform.Attachments
          feature_management__feature_flags__1__enabled: "false"
        run: |
          nohup dotnet run --project Tests/EndToEnd/Dewiride.Erp.Testing.EndToEndHost --no-build -c Release -- --port 5181 --web-origin https://localhost:3202 > "$RUNNER_TEMP/api-gated.log" 2>&1 &
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:5181/healthz/live && break; sleep 1; done
          curl -sf http://127.0.0.1:5181/healthz/live
      - name: Start web app against the gated API
        working-directory: frontend/apps/web
        env:
          API_INTERNAL_URL: http://127.0.0.1:5181
        run: |
          nohup pnpm exec next start -H 127.0.0.1 -p 3102 > "$RUNNER_TEMP/web-gated.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3102/healthz && break; sleep 1; done
          curl -sf http://127.0.0.1:3102/healthz
      - name: Serve the web apps over https
        working-directory: frontend/e2e
        run: |
          nohup node servers/https-front.ts 3200=http://127.0.0.1:3100 3201=http://127.0.0.1:3101 3202=http://127.0.0.1:3102 > "$RUNNER_TEMP/https.log" 2>&1 &
          for i in $(seq 1 30); do curl -sfk https://localhost:3200/healthz && break; sleep 1; done
          curl -sfk https://localhost:3200/healthz
      - name: Run Playwright
        working-directory: frontend/e2e
        env:
          E2E_BASE_URL: https://localhost:3200
          E2E_API_BASE_URL: http://127.0.0.1:5180
          E2E_OFFLINE_BASE_URL: https://localhost:3201
          E2E_GATED_BASE_URL: https://localhost:3202
          E2E_GATED_API_BASE_URL: http://127.0.0.1:5181
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.project }}-${{ matrix.shard }}.zip
        run: pnpm exec playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blob-report-${{ matrix.project }}-${{ matrix.shard }}
          path: frontend/e2e/blob-report
          retention-days: 7
          if-no-files-found: error
      - name: Upload screenshots and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            frontend/e2e/screenshots
            frontend/e2e/test-results
          retention-days: 14
          if-no-files-found: warn
      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-logs-${{ matrix.project }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/*.log
          retention-days: 7

  report:
    name: Playwright
    needs: playwright
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up frontend
        uses: ./.github/actions/setup-frontend
      - name: Download blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: blob-report-*
          merge-multiple: true
          path: frontend/e2e/all-blob-reports
      - name: Merge into one HTML report
        working-directory: frontend/e2e
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports
      - name: Upload HTML report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/e2e/playwright-report
          retention-days: 14
          if-no-files-found: error
      # The one job the ruleset requires, so it fails whenever a shard did not pass, whatever the number of projects and shards.
      - name: Fail when a shard did not pass
        if: ${{ needs.playwright.result != 'success' }}
        env:
          SHARDS_RESULT: ${{ needs.playwright.result }}
        run: |
          echo "::error::The Playwright shards ended as $SHARDS_RESULT."
          exit 1
